<section class="final-cta" aria-labelledby="final-cta-title">
  <img
    class="final-cta__olive final-cta__olive--left"
    src="/images/home/olivo1.png"
    alt=""
    aria-hidden="true"
    loading="lazy"
  />

  <div class="final-cta__content">
    <h2 id="final-cta-title">
      {{ 'home.quoteCta.title' | translate }}
    </h2>

    <p>
      {{ 'home.quoteCta.description' | translate }}
    </p>

    <a class="final-cta__action" routerLink="/solicitar-presupuesto">
      {{ 'home.quoteCta.action' | translate }}
    </a>
  </div>

  <img
    class="final-cta__olive final-cta__olive--right"
    src="/images/home/olivo3.png"
    alt=""
    aria-hidden="true"
    loading="lazy"
  />
</section>
