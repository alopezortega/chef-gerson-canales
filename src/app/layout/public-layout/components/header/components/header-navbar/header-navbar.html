<div class="language-selector" aria-label="Language selector">
  <button
    class="language-selector__button"
    type="button"
    (click)="changeLanguage('es')"
    [attr.aria-pressed]="currentLanguage() === 'es'"
  >
    ES
  </button>

  <button
    class="language-selector__button"
    type="button"
    (click)="changeLanguage('en')"
    [attr.aria-pressed]="currentLanguage() === 'en'"
  >
    EN
  </button>
</div>

<button
  #menuButton
  class="menu-toggle"
  type="button"
  (click)="toggleMenu()"
  [attr.aria-label]="menuButtonLabelKey() | translate"
  [attr.aria-expanded]="menuOpen()"
  aria-controls="main-navigation social-navigation"
>
  @if (menuOpen()) {
    ✕
  } @else {
    ☰
  }
</button>

<nav
  id="main-navigation"
  [attr.aria-label]="'navigation.mainAriaLabel' | translate"
  [class.open]="menuOpen()"
>
  <ul>
    <li>
      <a routerLink="/servicios" routerLinkActive="active" (click)="closeMenu()">
        {{ 'navigation.links.services' | translate }}
      </a>
    </li>

    <li>
      <a routerLink="/galeria" routerLinkActive="active" (click)="closeMenu()">
        {{ 'navigation.links.gallery' | translate }}
      </a>
    </li>

    <li>
      <a
        routerLink="/solicitar-presupuesto"
        routerLinkActive="active"
        class="cta"
        (click)="closeMenu()"
      >
        {{ 'navigation.links.quoteRequest' | translate }}
      </a>
    </li>

    <li>
      <a routerLink="/sobre-el-chef" routerLinkActive="active" (click)="closeMenu()">
        {{ 'navigation.links.about' | translate }}
      </a>
    </li>
  </ul>
</nav>

<nav
  id="social-navigation"
  [attr.aria-label]="'navigation.socialAriaLabel' | translate"
  [class.open]="menuOpen()"
>
  <ul>
    <li>
      <a
        href="https://www.instagram.com/gersontravel.chef/"
        target="_blank"
        rel="noopener noreferrer"
        [attr.aria-label]="'navigation.instagramAriaLabel' | translate"
        (click)="closeMenu()"
      >
        Instagram
      </a>
    </li>
  </ul>
</nav>
